[package]
name = "denko-macros"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
description = "Compile-time source validation macros for Denko"

[lib]
proc-macro = true

[dependencies]
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.5", features = ["full", "parsing", "proc-macro", "visit"] }

[dev-dependencies]
walkdir = "2.5.0"

[lints]
workspace = true
