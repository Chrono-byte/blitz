name: Lint and format

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rustfmt.toml"
      - "crates/**/*.rs"
      - "crates/**/Cargo.toml"
      - "crates/blitz-runtime/assets/**"
      - "examples/**"
      - "language-server/**"
      - "tools/effect-assets/**"
      - ".forgejo/workflows/lint.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rustfmt.toml"
      - "crates/**/*.rs"
      - "crates/**/Cargo.toml"
      - "crates/blitz-runtime/assets/**"
      - "examples/**"
      - "language-server/**"
      - "tools/effect-assets/**"
      - ".forgejo/workflows/lint.yml"
  workflow_dispatch:

env:
  CI: "true"

jobs:
  workspace:
    name: Rust workspace
    runs-on: ci
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked
