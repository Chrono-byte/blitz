name: Format

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CI: "true"

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ci
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
