name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "examples/**"
      - "test262/harness/**"
      - "tools/effect-assets/**"
      - "tools/effect-bytecode/**"
      - ".forgejo/workflows/test.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "examples/**"
      - "test262/harness/**"
      - "tools/effect-assets/**"
      - "tools/effect-bytecode/**"
      - ".forgejo/workflows/test.yml"
  workflow_dispatch:

env:
  CI: "true"

jobs:
  workspace:
    name: Rust workspace
    runs-on: ci
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@1.97.0

      - name: Test Rust workspace
        run: cargo test --workspace --locked
