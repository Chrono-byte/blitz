name: Build

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "crates/**/build.rs"
      - "crates/**/src/**"
      - "crates/blitz-runtime/assets/**"
      - "examples/**"
      - "tools/effect-assets/**"
      - ".forgejo/workflows/build.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "crates/**/build.rs"
      - "crates/**/src/**"
      - "crates/blitz-runtime/assets/**"
      - "examples/**"
      - "tools/effect-assets/**"
      - ".forgejo/workflows/build.yml"
  workflow_dispatch:

env:
  CI: "true"

jobs:
  workspace:
    name: Rust workspace
    runs-on: ci
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install native build dependencies
        run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ make pkgconf-pkg-config openssl-devel

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@1.97.0

      - name: Build Rust workspace
        run: cargo build --workspace --locked
