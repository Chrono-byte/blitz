[package]
name = "blitz"
version = "0.1.2"
edition = "2024"
description = "ECMAScript VM: Rust base layer"

[[bin]]
name = "blitz"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
ouroboros = "0.18"
oxc_allocator = "0"
oxc_ast = { version = "0", features = ["serialize"] }
oxc_parser = "0"
oxc_semantic = "0"
oxc_span = "0"
oxc_syntax = "0"
rustyline = "18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
oxc_resolver = "11.17.1"
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
fastrand = "2.1"
regex = "1"
num-bigint = "0.4"
num-traits = "0.2"
indexmap = "2"
futures = "0.3"
oxc_str = "0.125.0"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde_yaml = "0.9"

[[bench]]
name = "vm_suite"
harness = false

[lints.clippy]
blocks_in_conditions = "warn"
bool_comparison = "warn"
box_collection = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
clone_on_ref_ptr = "warn"
cognitive_complexity = "warn"
default_numeric_fallback = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_identity = "warn"
float_cmp = "warn"
inefficient_to_string = "warn"
into_iter_on_ref = "warn"
iter_not_returning_iterator = "warn"
large_enum_variant = "warn"
large_stack_arrays = "warn"
map_clone = "warn"
map_unwrap_or = "warn"
missing_docs_in_private_items = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
multiple_crate_versions = "warn"
needless_borrow = "warn"
needless_collect = "warn"
needless_for_each = "warn"
option_option = "warn"
or_fun_call = "warn"
panic = "warn"
range_plus_one = "warn"
redundant_clone = "deny"
redundant_closure_for_method_calls = "deny"
similar_names = "warn"
single_char_pattern = "warn"
todo = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
unimplemented = "warn"
unreachable = "warn"
unused_async = "warn"
unwrap_used = "warn"
vec_box = "warn"
wrong_self_convention = "warn"

[lints.rust]
missing_docs = "deny"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
