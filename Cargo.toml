[package]
name = "blitz"
version = "0.1.1"
edition = "2024"
description = "ECMAScript VM: Rust base layer"

[features]
default = ["gc_mark_sweep_prototype"]
gc_mark_sweep_prototype = []

[[bin]]
name = "blitz"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
ouroboros = "0.18"
oxc_allocator = "0.123.0"
oxc_ast = { version = "0.123.0", features = ["serialize"] }
oxc_parser = "0.123.0"
oxc_semantic = "0.123.0"
oxc_span = "0.123.0"
oxc_syntax = "0.123.0"
rustyline = "18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
oxc_resolver = "11.17.1"
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
fastrand = "2.1"
regex = "1"
num-bigint = "0.4"
num-traits = "0.2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
serde_yaml = "0.9"

[[bench]]
name = "vm_suite"
harness = false

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
redundant_clone = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
similar_names = "allow"
single_char_pattern = "allow"
too_many_lines = "allow"

[lints.rust]
missing_docs = "warn"
