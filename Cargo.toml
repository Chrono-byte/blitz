[workspace]
members = [
  "crates/blitz-cli",
  "crates/denko-engine",
  "crates/denko-macros",
  "crates/blitz-runtime",
  "crates/blitz-test262",
  "crates/js-string",
  "crates/regex-js",
  "tools/effect-bytecode",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
denko = { package = "denko-engine", path = "crates/denko-engine" }
denko-macros = { path = "crates/denko-macros" }
blitz-runtime = { path = "crates/blitz-runtime" }
bytes = "1"
clap = { version = "4.5.57", features = ["derive"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
unicode-case-mapping = "1"
unicode-id-start = "1.4"
fastwebsockets = { version = "0.10", features = ["upgrade"] }
fastrand = "2.1"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
indexmap = "2"
js-string = { path = "crates/js-string" }
num-bigint = "0.4"
num-traits = "0.2"
ouroboros = "0.18"
oxc_allocator = "0.141.0"
oxc_ast = { version = "0.141.0", features = ["serialize"] }
oxc_parser = "0.141.0"
oxc_resolver = "11.17.1"
oxc_semantic = "0.141.0"
oxc_span = "0.141.0"
oxc_str = "0.141.0"
oxc_syntax = "0.141.0"
regex = "1"
regex-js = { path = "crates/regex-js" }
rustyline = "18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"

[workspace.lints.clippy]
# Keep Clippy's maintained default set while leaving the noisier pedantic,
# nursery, restriction, and cargo groups opt-in.
all = { level = "warn", priority = -2 }

# Semantic defects should never enter the workspace. Suspicious constructs and
# avoidable runtime costs stay visible without blocking incremental cleanup.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# Small, actionable hygiene rules that are useful across every Blitz crate.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
redundant_clone = "deny"
inefficient_to_string = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
needless_collect = "warn"
unused_async = "warn"

[workspace.lints.rust]
# These protect observable behavior and unsafe invariants rather than enforcing
# subjective formatting or documentation policy.
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
